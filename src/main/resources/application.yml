spring:
  application:
    name: like-ai-programming

  # Spring AI 配置
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:sk-your-key-here}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2000
      client:
        connect-timeout: 30s
        read-timeout: 60s
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:} # Claude Key
      chat:
        options:
          model: claude-3-5-sonnet-20241022
          temperature: 0.7
          max-tokens: 4096

  # 静态资源配置
  web:
    resources:
      static-locations: classpath:/static/

  # 启用Actuator
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
    endpoint:
      health:
        show-details: always

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json

# 日志配置
logging:
  level:
    com.like: DEBUG
    org.springframework.ai: INFO
  file:
    name: logs/app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 自定义配置
app:
  name: "Spring AI 智能助手"
  version: "1.0.0"
  description: "基于Spring Boot和Spring AI构建的智能对话系统"