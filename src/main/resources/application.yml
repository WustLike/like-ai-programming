spring:
  application:
    name:
      like-ai-programming
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:sk-304aa5c980d4486ba5edad11450ace23} # 优先从环境变量读取，也可直接写
      chat:
        options:
          model: deepseek-chat  # 可选：deepseek-chat, deepseek-reasoner
          temperature: 0.7      # 创造性，0-1，越高越随机
          max-tokens: 2048      # 最大生成长度

server:
  port: 8080

