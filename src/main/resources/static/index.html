<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI 智能对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            font-size: 32px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            margin-top: 5px;
        }

        .chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 20px;
            max-width: 80%;
            clear: both;
        }

        .user-message {
            float: right;
        }

        .ai-message {
            float: left;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message .message-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .ai-message .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message-time {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .user-message .message-time {
            text-align: right;
        }

        .input-container {
            padding: 20px;
            border-top: 1px solid #e2e8f0;
            background: white;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-wrapper textarea {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .input-wrapper textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 10px 0;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .model-selector {
            margin-bottom: 15px;
        }

        .model-selector label {
            font-size: 14px;
            color: #64748b;
            margin-right: 10px;
        }

        .model-selector select {
            padding: 6px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                border-radius: 10px;
            }

            .chat-container {
                height: 400px;
            }

            .message {
                max-width: 90%;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
    <!-- Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-robot"></i> Spring AI 智能助手</h1>
        <div class="subtitle">基于 Spring Boot + Spring AI 构建的专业AI对话系统</div>
    </div>

    <div class="model-selector" style="padding: 15px 20px 0;">
        <label for="model-select">选择AI模型：</label>
        <select id="model-select">
            <option value="deepseek-chat">DeepSeek Chat (通用)</option>
            <option value="deepseek-reasoner">DeepSeek Reasoner (推理)</option>
            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
        </select>
    </div>

    <div class="chat-container" id="chat-container">
        <!-- 初始欢迎消息 -->
        <div class="message ai-message">
            <div class="message-bubble">
                您好！我是基于Spring AI构建的智能助手。我可以帮助您解答各种问题，提供编程建议，分析问题等。请问有什么可以帮助您的吗？
            </div>
            <div class="message-time">现在</div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
                <textarea
                        id="message-input"
                        placeholder="请输入您的问题（支持多行输入，Shift+Enter换行）..."
                        rows="2"
                        onkeydown="handleKeyDown(event)"
                ></textarea>
            <button id="send-btn" class="send-btn" onclick="sendMessage()">
                发送
            </button>
        </div>
    </div>
</div>

<script>
    // 配置
    const API_BASE_URL = window.location.origin; // 自动获取当前域名
    const CHAT_API = '/api/ai/chat';  // 对应您的后端接口

    // DOM元素
    const chatContainer = document.getElementById('chat-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const modelSelect = document.getElementById('model-select');

    // 自动调整输入框高度
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // 发送消息函数
    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        // 禁用输入和按钮
        messageInput.disabled = true;
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 思考中';

        // 显示用户消息
        addMessage(message, 'user');

        // 清空输入框
        messageInput.value = '';
        messageInput.style.height = 'auto';

        // 显示"正在输入"指示器
        typingIndicator.style.display = 'block';
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
            // 调用后端API
            const response = await fetch(API_BASE_URL + CHAT_API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    model: modelSelect.value
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            // 隐藏"正在输入"指示器
            typingIndicator.style.display = 'none';

            // 显示AI回复
            if (data.success) {
                addMessage(data.content, 'ai');
            } else {
                addMessage(`抱歉，AI服务暂时不可用。错误：${data.errorMessage || '未知错误'}`, 'ai');
            }

        } catch (error) {
            console.error('Error:', error);
            typingIndicator.style.display = 'none';
            addMessage('抱歉，与服务器通信时发生错误。请检查网络连接或稍后重试。', 'ai');
        } finally {
            // 重新启用输入和按钮
            messageInput.disabled = false;
            sendBtn.disabled = false;
            sendBtn.innerHTML = '发送';
            messageInput.focus();
        }
    }

    // 添加消息到聊天窗口
    function addMessage(content, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}-message`;

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        messageDiv.innerHTML = `
            <div class="message-bubble">${formatMessage(content)}</div>
            <div class="message-time">${time}</div>
        `;

        chatContainer.insertBefore(messageDiv, typingIndicator);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 格式化消息内容（支持Markdown基本语法）
    function formatMessage(content) {
        // 转义HTML
        let formatted = content
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

        // 简单的Markdown转换
        formatted = formatted
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\n/g, '<br>');

        return formatted;
    }

    // 键盘事件处理
    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    // 页面加载时自动聚焦输入框
    window.addEventListener('DOMContentLoaded', () => {
        messageInput.focus();
    });
</script>
</body>
</html>
